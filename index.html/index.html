<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Blue Tulip Garden</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <div id="finalGlow"></div>

    <div id="intro">

    <div id="introCard">

        <div class="moonIcon">🌙</div>

        <h1>Para ti...</h1>

        <p>

            He preparado un pequeño jardín.

            Espero que te haga sonreír.

        </p>

        <button id="startButton">

            💙 Toca para comenzar

        </button>

    </div>

</div>

<!-- ========================================= -->
<!-- SKY -->
<!-- ========================================= -->

<div id="sky">

    <div id="moonGlow"></div>

    <div id="messageFlash"></div>

    <div id="aurora"></div>

    <div id="skyFlash"></div>

    <div id="moon"></div>

    <div id="moonLight"></div>

    <div id="stars"></div>

    <div id="shootingStars"></div>

    <div id="clouds"></div>

    <div id="mist"></div>

</div>

<!-- ========================================= -->
<!-- GARDEN -->
<!-- ========================================= -->

<div id="garden">

    <div id="backGrass"></div>

    <div id="flowersLayerBack"></div>

    <div id="flowersLayerMiddle"></div>

    <div id="flowersLayerFront"></div>

    <div id="sunflowerLayer"></div>

    <div id="petals"></div>

    <div id="frontGrass"></div>

</div>

<!-- ========================================= -->
<!-- PARTICLES -->
<!-- ========================================= -->

<div id="fireflies"></div>

<div id="floatingParticles"></div>

<div id="heartParticles"></div>

<!-- ========================================= -->
<!-- MESSAGE -->
<!-- ========================================= -->

<div id="messageContainer">

    <div id="message"></div>

</div>

<!-- ========================================= -->
<!-- MUSIC -->
<!-- ========================================= -->

<button id="musicButton">

    ▶

</button>

<audio
id="backgroundMusic"
loop
preload="auto">

<source
src="music/JungKook-Seven-feat.-Latto.mp3"
type="audio/mpeg">
</audio>

<!-- ========================================= -->
<!-- JAVASCRIPT -->
<!-- ========================================= -->


<script src="js/sky.js"></script>
<script src="js/garden.js"></script>
<script src="js/flowers.js"></script>
<script src="js/sunflowers.js"></script>
<script src="js/wind.js"></script>
<script src="js/meteors.js"></script>
<script src="js/fireflies.js"></script>
<script src="js/petals.js"></script>
<script src="js/mist.js"></script>
<script src="js/environment.js"></script>
<script src="js/moonlight.js"></script>
<script src="js/parallax.js"></script>
<script src="js/message.js"></script>
<script src="js/aurora.js"></script>
<script src="js/moonrays.js"></script>
<script src="js/camera.js"></script>
<script src="js/intro.js"></script>
<script src="js/music.js"></script>
<script src="js/legendaryMeteor.js"></script>
<script src="js/script.js"></script>

</body>

</html>
